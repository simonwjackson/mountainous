# Configuration file for libinput-gestures on AYANEO AIR handheld
# Gaming-optimized touch gestures for Hyprland

# 3-finger swipe left/right: Switch workspaces
gesture swipe right 3 hyprctl dispatch workspace e-1
gesture swipe left 3 hyprctl dispatch workspace e+1

# 4-finger swipe up: Toggle fullscreen
gesture swipe up 4 hyprctl dispatch fullscreen 1

# 4-finger swipe down: Launch or focus Steam
gesture swipe down 4 sh -c 'hyprctl clients | grep -iq "class: steam" && hyprctl dispatch focuswindow "class:^(steam)$" || steam'

# 3-finger pinch in: Show special workspace (like mission control)
gesture pinch in 3 hyprctl dispatch togglespecialworkspace magic

# 3-finger pinch out: Hide special workspace
gesture pinch out 3 hyprctl dispatch togglespecialworkspace magic

# 2-finger swipe up: Increase brightness
gesture swipe up 2 brightnessctl set +5%

# 2-finger swipe down: Decrease brightness
gesture swipe down 2 brightnessctl set 5%-
