general {
    lock_cmd = pidof hyprlock || @lock@
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = @dpmsOn@
    inhibit_sleep = 3
    # These run when the compositor confirms the lock, not at an idle threshold.
    on_lock_cmd = systemctl --user restart mountainous-lock-screen-off.service
    on_unlock_cmd = systemctl --user stop mountainous-lock-screen-off.service
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# After a wake, blank again only while locked. The first blank is timed from
# on_lock_cmd, not from this listener's session-wide idle clock.
listener {
    timeout = 30
    condition_cmd = pidof hyprlock && systemctl --user is-active --quiet mountainous-lock-screen-off.service
    on-timeout = @dpmsOff@
    on-resume = @dpmsOn@
}

listener {
    timeout = 900
    condition_cmd = @onBattery@
    condition_retry = 60
    on-timeout = systemctl suspend
}
