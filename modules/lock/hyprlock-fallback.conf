# Static fallback for mountainous-lock: used only when the wrapper fails.
# No monitor names, no generated files, no dialog art: it must always load.
general {
    ignore_empty_input = true
    fail_timeout = 3000
}
background {
    monitor =
    color = rgb(262628)
}
label {
    monitor =
    text = Session is locked. Enter the password for $USER:
    font_family = ChicagoFLF
    font_size = 14
    color = rgb(ececec)
    position = 0, 60
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 450, 36
    position = 0, 0
    halign = center
    valign = center
    outline_thickness = 2
    rounding = 0
    inner_color = rgb(242424)
    outer_color = rgb(000000)
    font_color = rgb(ececec)
    font_family = ChicagoFLF
    fade_on_empty = false
    placeholder_text =
    fail_text = Wrong password.
    check_color = rgb(5858d0)
    fail_color = rgb(ef8f8f)
    capslock_color = rgb(d5a66f)
}
