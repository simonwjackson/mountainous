# Who can decrypt what.
#
# The master is the operator's ed25519 SSH key -- the same identity the old
# agenix tree used, so ~/.ssh stays the only thing under management. sops
# cannot read an SSH private key itself, so it is converted at call time:
#
#   SOPS_AGE_KEY="$(ssh-to-age -private-key -i ~/.ssh/id_ed25519)" sops ...
#
# scripts/secrets wraps that. Nothing is written to disk.
#
# Host entries are the age form of each machine's ed25519 SSH host key, so a
# machine decrypts with an identity it already holds. The private halves live
# in ~/.local/share/mountainous/hostkeys/ and are planted at install time via
# --extra-files, which is what lets a fresh machine decrypt on first boot.
#
# Every secret file must match exactly one creation rule. A file matching none
# cannot be created; a file matching two silently uses the first.
keys:
  - &master age1zlz3fwumguttvgv6qpkrtm5q7ehx2whxlez7endyvzx82wssrdwsg63685
  - &hiyori age1eec4gj5lck03lz88z4xclul9853w0jlzfc3maz63rv7uaa2kp59qg4ywk5
  - &myoko  age1shhjq0w8cl2fp0thxnq3elm7utag3e4f8fnvpymvmx5jwpyk9q2sy7ml0u
  - &tate   age10cjse77wdjzdgygfh0k28g960psu2qysx8czdl0v4h9sv66huuzqrjkuy6
  - &ibuki  age139z7cqp2vf8x8vgzcdax3v7adf5xgkv8757tznlkkv7v57cj430svkm0sp
  - &unzen  age1keuga3fh4s42sm9ze4kcwmqe8mkt4tyw9jzgdtur2e24ntszqc5s8c98jz
  - &rakku  age15t6g4dck4vpkfg80303wy8fvl3ptczd7ehgd3ppqrcgv2fszkv4q50s2a4
  - &yari   age17cd96z69ajdlp0rhn8n2lkn4q7d297lnt3q9u6uanayn3l7r09jsmrgxrd
  - &fuji   age1uur583kgtw9avx5r3s5pnsgn0tqx8f8shknps56syrc7ndmcyczsknzrqv

creation_rules:
  # Fleet-wide. Every machine needs these, so every machine can read them.
  - path_regex: secrets/fleet\.yaml$
    key_groups:
      - age:
          - *master

          - *hiyori
          - *myoko
          - *tate
          - *ibuki
          - *unzen
          - *rakku
          - *yari
          - *fuji

  # Per-host. A machine reads only its own file.
  - path_regex: secrets/hosts/fuji\.yaml$
    key_groups:
      - age:
          - *master
          - *fuji

  - path_regex: secrets/hosts/rakku\.yaml$
    key_groups:
      - age:
          - *master
          - *rakku

  - path_regex: secrets/hosts/hiyori\.yaml$
    key_groups:
      - age:
          - *master

          - *hiyori

  - path_regex: secrets/hosts/myoko\.yaml$
    key_groups:
      - age:
          - *master

          - *myoko

  - path_regex: secrets/hosts/tate\.yaml$
    key_groups:
      - age:
          - *master

          - *tate

  - path_regex: secrets/hosts/ibuki\.yaml$
    key_groups:
      - age:
          - *master
          - *ibuki

  - path_regex: secrets/hosts/unzen\.yaml$
    key_groups:
      - age:
          - *master
          - *unzen

  - path_regex: secrets/hosts/yari\.yaml$
    key_groups:
      - age:
          - *master
          - *yari

  # Registration credentials belong to UNZEN, not to the fleet secret file.
  - path_regex: secrets/hosts/unzen-github-actions\.yaml$
    key_groups:
      - age:
          - *master
          - *unzen

  # Notification credentials have their own rotation boundary.
  - path_regex: secrets/notify/server\.yaml$
    key_groups:
      - age:
          - *master
          - *rakku

  # The Beszel hub's SSH key, every agent's token, and its alert bridge token.
  - path_regex: secrets/beszel/hub\.yaml$
    key_groups:
      - age:
          - *master
          - *rakku

  - path_regex: secrets/notify/storage-unzen\.yaml$
    key_groups:
      - age:
          - *master
          - *unzen

  - path_regex: secrets/notify/myoko\.yaml$
    key_groups:
      - age:
          - *master
          - *myoko

  - path_regex: secrets/notify/hiyori\.yaml$
    key_groups:
      - age:
          - *master
          - *hiyori

  # Read-only Beszel MCP access for each desktop, separate from notifications.
  - path_regex: secrets/desktop/myoko\.yaml$
    key_groups:
      - age:
          - *master
          - *myoko

  - path_regex: secrets/desktop/hiyori\.yaml$
    key_groups:
      - age:
          - *master
          - *hiyori

  - path_regex: secrets/notify/fleet\.yaml$
    key_groups:
      - age:
          - *master
          - *hiyori
          - *myoko
          - *tate
          - *ibuki
          - *unzen
          - *rakku
          - *yari
          - *fuji
